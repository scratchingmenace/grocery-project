<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Where to buy your list — Ottawa grocery savings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --counter-a: #2B2016;
    --counter-b: #201710;
    --paper: #F6F1E2;
    --ink: #2B2620;
    --ink-soft: #6B6252;
    --ink-faint: #A89F8C;
    --stamp: #B23B2E;
    --worth: #3F6146;
    --bonus: #8A6A2F;
    --none: #8A8071;
    --focus: #D9A441;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Space Mono', monospace;
    background:
      radial-gradient(ellipse 700px 380px at 50% 0%, rgba(255,255,255,0.05), transparent 60%),
      repeating-linear-gradient(115deg, var(--counter-a) 0px, var(--counter-a) 2px, var(--counter-b) 2px, var(--counter-b) 4px);
    color: var(--paper);
    min-height: 100vh;
    padding: 44px 16px 80px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 400px; margin: 0 auto; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

  .masthead { margin: 0 4px 26px; }
  h1 {
    font-weight: 700;
    font-size: 27px;
    line-height: 1.22;
    letter-spacing: -0.3px;
    text-transform: uppercase;
    margin: 0;
    color: var(--paper);
    text-shadow: 1.5px 0 0 rgba(178,59,46,0.4);
  }
  .lede { color: #C9C0AC; font-size: 13px; margin-top: 12px; line-height: 1.65; max-width: 40ch; }
  .num { font-variant-numeric: tabular-nums; }
  .loading { color: #C9C0AC; font-size: 13px; padding: 40px 4px; text-align: center; }

  /* ---- control dial ---- */
  .dial {
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 4px;
    padding: 16px 18px 18px;
    margin: 0 4px 32px;
  }
  .dial-title { font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; color: #C9C0AC; margin-bottom: 12px; }
  .dial-row { margin-bottom: 12px; }
  .dial-row:last-child { margin-bottom: 0; }
  .dial-label-line { display: flex; justify-content: space-between; font-size: 11.5px; color: #D8D0BE; margin-bottom: 6px; }
  .dial-label-line .v { color: var(--focus); font-weight: 700; }
  input[type="range"] { width: 100%; accent-color: var(--focus); }
  .dial-endcaps { display: flex; justify-content: space-between; font-size: 9.5px; color: #8A8271; margin-top: 4px; letter-spacing: 0.2px; }
  .dial-thresholds { font-size: 10.5px; color: #A79F8C; margin-top: 10px; line-height: 1.6; }
  .winter-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #D8D0BE; padding-top: 2px; }
  .winter-row input { width: 15px; height: 15px; accent-color: var(--focus); }

  /* ---- shopping trip bar ---- */
  .trip-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: rgba(217,164,65,0.12);
    border: 1px solid rgba(217,164,65,0.35);
    border-radius: 4px;
    padding: 10px 14px;
    margin: 0 4px 22px;
    font-size: 11.5px;
    color: #EFE6D2;
  }
  .trip-bar button {
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    color: var(--counter-a);
    background: var(--focus);
    border: none;
    border-radius: 3px;
    padding: 7px 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .trip-bar button:hover { filter: brightness(1.08); }

  /* ---- item picker ---- */
  .picker {
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 4px;
    padding: 16px 18px 18px;
    margin: 0 4px 32px;
  }
  .picker-title { font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; color: #C9C0AC; margin-bottom: 12px; }
  .picker-selectall { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #D8D0BE; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px dashed rgba(255,255,255,0.16); }
  .picker-selectall input { width: 15px; height: 15px; accent-color: var(--focus); }
  .picker-list { max-height: 320px; overflow-y: auto; margin-bottom: 14px; }
  .picker-item { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #D8D0BE; padding: 6px 2px; border-bottom: 1px dotted rgba(255,255,255,0.1); }
  .picker-item:last-child { border-bottom: none; }
  .picker-item input { width: 15px; height: 15px; accent-color: var(--focus); flex-shrink: 0; }
  .picker-start-btn {
    width: 100%;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--counter-a);
    background: var(--focus);
    border: none;
    border-radius: 3px;
    padding: 11px;
    cursor: pointer;
  }
  .picker-start-btn:hover { filter: brightness(1.08); }

  /* ---- receipt ---- */
  .receipt-slot { position: relative; margin: 0 0 44px; }
  .receipt {
    position: relative;
    background: var(--paper);
    color: var(--ink);
    padding: 26px 22px 20px;
    box-shadow: 0 18px 30px -12px rgba(0,0,0,0.55), 0 3px 0 rgba(0,0,0,0.15);
    opacity: 0;
    transform: translateY(-26px);
  }
  .receipt.torn::before {
    content: '';
    position: absolute;
    top: -9px; left: 0; right: 0; height: 18px;
    background: var(--paper);
    clip-path: polygon(0.0% 0px, 3.03% 9px, 6.06% 0px, 9.09% 9px, 12.12% 0px, 15.15% 9px, 18.18% 0px, 21.21% 9px, 24.24% 0px, 27.27% 9px, 30.3% 0px, 33.33% 9px, 36.36% 0px, 39.39% 9px, 42.42% 0px, 45.45% 9px, 48.48% 0px, 51.52% 9px, 54.55% 0px, 57.58% 9px, 60.61% 0px, 63.64% 9px, 66.67% 0px, 69.7% 9px, 72.73% 0px, 75.76% 9px, 78.79% 0px, 81.82% 9px, 84.85% 0px, 87.88% 9px, 90.91% 0px, 93.94% 9px, 96.97% 0px, 100% 9px, 100% 100%, 0% 100%);
  }
  .receipt.tail::after {
    content: '';
    position: absolute;
    bottom: -9px; left: 0; right: 0; height: 18px;
    background: var(--paper);
    clip-path: polygon(0.0% 9px, 3.03% 0px, 6.06% 9px, 9.09% 0px, 12.12% 9px, 15.15% 0px, 18.18% 9px, 21.21% 0px, 24.24% 9px, 27.27% 0px, 30.3% 9px, 33.33% 0px, 36.36% 9px, 39.39% 0px, 42.42% 9px, 45.45% 0px, 48.48% 9px, 51.52% 0px, 54.55% 9px, 57.58% 0px, 60.61% 9px, 63.64% 0px, 66.67% 9px, 69.7% 0px, 72.73% 9px, 75.76% 0px, 78.79% 9px, 81.82% 0px, 84.85% 9px, 87.88% 0px, 90.91% 9px, 93.94% 0px, 96.97% 9px, 100% 0px, 100% 100%, 0% 100%);
  }

  .r-header { text-align: center; margin-bottom: 14px; }
  .r-store { font-size: 19px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
  .r-loc { font-size: 11px; color: var(--ink-soft); margin-top: 3px; letter-spacing: 0.3px; }

  .r-rule { border: none; border-top: 1px dashed var(--ink-faint); margin: 12px 0; }
  .r-rule.heavy { border-top-style: solid; border-top-width: 1px; border-color: var(--ink); opacity: 0.75; }

  .r-meta-row { display: flex; justify-content: space-between; font-size: 11.5px; padding: 2px 0; color: var(--ink-soft); }
  .r-meta-row .v { color: var(--ink); font-weight: 700; }

  .r-group-label { text-align: center; font-size: 11px; color: var(--ink-soft); margin: 12px 0 8px; letter-spacing: 0.4px; }
  .r-group-label.muted { opacity: 0.6; font-style: italic; }

  .r-item { display: flex; align-items: baseline; gap: 6px; font-size: 13px; padding: 4px 0; flex-wrap: wrap; }
  .r-item .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-item .leader { flex: 1; border-bottom: 1px dotted var(--ink-faint); height: 0; margin-bottom: 4px; min-width: 8px; }
  .r-item .price { white-space: nowrap; }
  .r-item .price.na { color: var(--ink-faint); font-style: italic; }
  .r-item .price.justify { color: var(--worth); font-weight: 700; }
  .r-item .price.bonus { color: var(--bonus); }
  .r-item .price.none { color: var(--ink-faint); }

  .tag { font-size: 9px; letter-spacing: 0.3px; text-transform: uppercase; padding: 1px 5px; border-radius: 2px; white-space: nowrap; font-weight: 700; border: 1px solid currentColor; }
  .tag-justify { color: var(--worth); }
  .tag-bonus { color: var(--bonus); }
  .tag-none { color: var(--none); }

  .r-legend { font-size: 10.5px; color: var(--ink-soft); line-height: 1.9; margin-top: 2px; }
  .r-legend .tag { margin-right: 6px; }

  .r-subtotal { display: flex; justify-content: space-between; font-size: 12.5px; padding: 6px 0 2px; color: var(--ink-soft); }
  .r-subtotal .v { color: var(--ink); }

  .r-total { display: flex; justify-content: space-between; align-items: baseline; font-size: 17px; font-weight: 700; padding: 4px 0 2px; }

  .r-stamp {
    position: absolute;
    top: 20px; right: 12px;
    border: 2.5px solid var(--stamp);
    color: var(--stamp);
    padding: 5px 9px 6px;
    font-weight: 700;
    font-size: 11.5px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    transform: rotate(-9deg);
    mix-blend-mode: multiply;
    opacity: 0.88;
    text-align: center;
    line-height: 1.3;
    pointer-events: none;
  }

  .r-barcode {
    height: 34px;
    margin: 16px 2px 6px;
    background-repeat: repeat-x;
    background-size: auto 100%;
  }

  .r-footer { text-align: center; font-size: 10.5px; color: var(--ink-soft); letter-spacing: 0.3px; }
  .r-note { font-style: italic; font-size: 11.5px; color: var(--ink-soft); text-align: center; margin-top: 14px; line-height: 1.55; }

  /* ---- stop-by-stop addendum ---- */
  .stop-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; padding: 6px 0; border-bottom: 1px dotted var(--ink-faint); gap: 8px; }
  .stop-row:last-child { border-bottom: none; }
  .stop-left { display: flex; flex-direction: column; }
  .stop-store { font-weight: 700; }
  .stop-sub { font-size: 10px; color: var(--ink-soft); margin-top: 1px; }
  .stop-right { text-align: right; white-space: nowrap; }
  .stop-right .running { display: block; font-size: 10px; color: var(--ink-soft); margin-top: 1px; }
  .stop-row.thin .stop-right .add { color: var(--ink-faint); }

  @media (prefers-reduced-motion: reduce) {
    .receipt { transition: none !important; }
  }

  @media (max-width: 380px) {
    h1 { font-size: 23px; }
    .r-store { font-size: 17px; }
    .r-total { font-size: 15.5px; }
    .receipt { padding: 22px 16px 18px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="masthead">
      <h1>Where to buy your list</h1>
      <p class="lede" id="lede">Loading your receipts…</p>
    </div>

    <div class="trip-bar" id="trip-bar" hidden>
      <span id="trip-count"></span>
      <button type="button" id="trip-done-btn">Done shopping</button>
    </div>

    <div class="picker" id="picker" hidden>
      <div class="picker-title">Pick this week's list</div>
      <label class="picker-selectall"><input type="checkbox" id="picker-select-all" checked> Select all</label>
      <div class="picker-list" id="picker-list"></div>
      <button type="button" class="picker-start-btn" id="picker-start-btn">Start shopping →</button>
    </div>

    <div class="dial" id="dial" hidden>
      <div class="dial-title">Effort dial</div>
      <div class="dial-row">
        <div class="dial-label-line"><span>How big a win before a store is worth it</span><span class="v" id="dial-mult">1.0×</span></div>
        <input type="range" id="mult-slider" min="0.5" max="2" step="0.1" value="1">
        <div class="dial-endcaps"><span>Chase savings</span><span>Only big wins</span></div>
        <div class="dial-thresholds" id="dial-thresholds"></div>
      </div>
      <div class="dial-row winter-row">
        <input type="checkbox" id="winter-toggle">
        <label for="winter-toggle">Winter mode — raise the bar ~50%</label>
      </div>
    </div>

    <div id="card-superstore"></div>
    <div id="card-cheapest"></div>
    <div id="card-compare"></div>
    <div id="card-mix"></div>

    <div id="loading-msg"><div class="loading">Ringing up prices…</div></div>
  </div>

  <script>
    const fmt = (n) => '$' + n.toFixed(2);
    const TRIP_STORAGE_KEY = 'grocery-trip-v1';

    function loadTripSelection() {
      try {
        const raw = localStorage.getItem(TRIP_STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) && parsed.length ? parsed : null;
      } catch (e) {
        return null;
      }
    }

    function saveTripSelection(names) {
      try { localStorage.setItem(TRIP_STORAGE_KEY, JSON.stringify(names)); } catch (e) { /* ignore */ }
    }

    function clearTripSelection() {
      try { localStorage.removeItem(TRIP_STORAGE_KEY); } catch (e) { /* ignore */ }
    }

    // Shows the item checklist and resolves once the user taps "Start
    // shopping", returning the list of chosen item names.
    function waitForTripStart(allItems) {
      return new Promise((resolve) => {
        const picker = document.getElementById('picker');
        const list = document.getElementById('picker-list');
        list.innerHTML = allItems.map((item, idx) => (
          '<label class="picker-item"><input type="checkbox" class="picker-check" data-idx="' + idx + '" checked><span>' + item.name + '</span></label>'
        )).join('');
        picker.hidden = false;

        const selectAll = document.getElementById('picker-select-all');
        selectAll.checked = true;
        const getChecks = () => Array.from(document.querySelectorAll('.picker-check'));

        selectAll.addEventListener('change', () => {
          getChecks().forEach((c) => { c.checked = selectAll.checked; });
        });
        list.addEventListener('change', (e) => {
          if (e.target.classList.contains('picker-check') && !e.target.checked) {
            selectAll.checked = false;
          }
        });
        document.getElementById('picker-start-btn').addEventListener('click', () => {
          const chosen = getChecks().filter((c) => c.checked).map((c) => allItems[parseInt(c.getAttribute('data-idx'), 10)].name);
          if (!chosen.length) { alert('Pick at least one item before starting your trip.'); return; }
          picker.hidden = true;
          resolve(chosen);
        });
      });
    }

    function showTripBar(count, total) {
      const bar = document.getElementById('trip-bar');
      document.getElementById('trip-count').textContent = 'Shopping trip active — ' + count + ' of ' + total + ' items';
      bar.hidden = false;
      document.getElementById('trip-done-btn').addEventListener('click', () => {
        if (confirm('End this shopping trip? Your list will be cleared so you can pick fresh next time.')) {
          clearTripSelection();
          location.reload();
        }
      });
    }

    function isEligible(item, store, storesCfg) {
      if (!item.requiresHalal) return true;
      const s = storesCfg.stores[store];
      return !!(s && s.halalMeat);
    }

    function computeStoreTotal(items, store, storesCfg) {
      let total = 0, missing = 0;
      for (const item of items) {
        const p = item.prices[store];
        if (p == null || !isEligible(item, store, storesCfg)) missing += 1; else total += p;
      }
      return { total, missing };
    }

    function tierOf(storesCfg, store) {
      const s = storesCfg.stores[store];
      return s ? s.tier : 'medium';
    }

    function effectiveThreshold(storesCfg, tier, multiplier, winter) {
      const base = storesCfg.tierDefaults[tier] ? storesCfg.tierDefaults[tier].threshold : 2.0;
      return base * multiplier * (winter ? 1.5 : 1);
    }

    // How close (in dollars) a store's price needs to be to the cheapest
    // qualifying option before we'll stick with a store already on the
    // route, rather than adding a separate stop for a marginal saving.
    const STICKY_BUFFER = 0.35;

    // Superstore is the anchor: an item only moves to another store if the
    // savings clear that store's tier bar. Pass 1 picks the globally
    // cheapest qualifying store per item, in isolation. Pass 2 then checks
    // whether a store that's already "active" (used by some other item)
    // is within STICKY_BUFFER of that best price — if so, it keeps the
    // item at the store you're already visiting instead of adding a stop.
    function assignItems(items, stores, storesCfg, multiplier, winter) {
      const baseline = items.map((item) => {
        const superstorePrice = item.prices['Superstore'];
        const candidates = [];
        for (const store of stores) {
          if (store === 'Superstore') continue;
          if (!isEligible(item, store, storesCfg)) continue;
          const price = item.prices[store];
          if (price == null) continue;
          const tier = tierOf(storesCfg, store);
          const savings = superstorePrice - price;
          const threshold = effectiveThreshold(storesCfg, tier, multiplier, winter);
          if (savings >= threshold) candidates.push({ store, price, tier, savings });
        }
        candidates.sort((a, b) => a.price - b.price);
        // "Confidence" = gap to the runner-up. A big gap means this item has
        // a clear favorite; a tiny gap means it's a toss-up that should
        // defer to wherever else the trip is already going.
        const confidence = candidates.length > 1 ? (candidates[1].price - candidates[0].price) : Infinity;
        return { name: item.name, superstorePrice, candidates, confidence };
      });

      // Decide clear-favorite items first (they anchor a store), then
      // near-tied items — which can then gravitate to an already-active
      // store within the buffer instead of scattering to their own pick.
      const order = baseline
        .map((_, idx) => idx)
        .filter((idx) => baseline[idx].candidates.length > 0)
        .sort((a, c) => baseline[c].confidence - baseline[a].confidence);

      const chosenByIdx = new Array(baseline.length).fill(null);
      const activeStores = new Set();

      for (const idx of order) {
        const b = baseline[idx];
        const cheapest = b.candidates[0];
        const sticky = b.candidates
          .filter((c) => activeStores.has(c.store))
          .filter((c) => c.price - cheapest.price <= STICKY_BUFFER)
          .sort((a, c) => a.price - c.price)[0];
        const chosen = sticky || cheapest;
        chosenByIdx[idx] = chosen;
        activeStores.add(chosen.store);
      }

      return baseline.map((b, idx) => {
        const chosen = chosenByIdx[idx];
        const assignedStore = chosen ? chosen.store : 'Superstore';
        const assignedPrice = chosen ? chosen.price : b.superstorePrice;
        return {
          name: b.name,
          superstorePrice: b.superstorePrice,
          assignedStore,
          assignedPrice,
          savings: b.superstorePrice - assignedPrice,
        };
      });
    }

    function buildMixGroups(assignments) {
      const byStore = {};
      for (const a of assignments) {
        if (!byStore[a.assignedStore]) byStore[a.assignedStore] = [];
        byStore[a.assignedStore].push(a);
      }
      const groups = Object.entries(byStore)
        .filter(([store]) => store !== 'Superstore')
        .map(([store, rows]) => ({
          store,
          rows: rows.sort((a, b) => b.assignedPrice - a.assignedPrice),
          subtotal: rows.reduce((s, r) => s + r.assignedPrice, 0),
        }))
        .sort((a, b) => b.subtotal - a.subtotal);
      const staying = byStore['Superstore'] || [];
      const total = assignments.reduce((s, a) => s + a.assignedPrice, 0);
      return { groups, staying, total, storeCount: groups.length };
    }

    function buildStopByStop(groups, storesCfg) {
      const ranked = groups
        .map((g) => ({
          store: g.store,
          tier: tierOf(storesCfg, g.store),
          savings: g.rows.reduce((s, r) => s + r.savings, 0),
          count: g.rows.length,
        }))
        .sort((a, b) => b.savings - a.savings);
      let running = 0;
      return ranked.map((r) => {
        running += r.savings;
        const tierInfo = storesCfg.tierDefaults[r.tier] || { label: r.tier, typicalMinutes: null };
        return { ...r, running, tierLabel: tierInfo.label, minutes: tierInfo.typicalMinutes };
      });
    }

    function itemRowHtml(name, price) {
      const priceHtml = price == null
        ? '<span class="price na num">n/a</span>'
        : '<span class="price num">' + fmt(price) + '</span>';
      return '<div class="r-item"><span class="name">' + name + '</span><span class="leader"></span>' + priceHtml + '</div>';
    }

    function compareRowHtml(row) {
      const sign = row.savings > 0 ? '+' : (row.savings < 0 ? '\u2212' : '');
      const diffText = sign + '$' + Math.abs(row.savings).toFixed(2);
      const priceHtml = '<span class="price ' + row.cls + ' num">' + diffText + '</span>';
      return (
        '<div class="r-item"><span class="name">' + row.name + '</span><span class="leader"></span>' +
        priceHtml + '<span class="tag ' + row.tagCls + '">' + row.tagText + '</span></div>'
      );
    }

    function barcodeSvg(seed) {
      let s = 0;
      for (let i = 0; i < seed.length; i++) s = (s * 31 + seed.charCodeAt(i)) >>> 0;
      const rand = () => { s = (s * 1103515245 + 12345) >>> 0; return (s / 4294967296); };
      let x = 0, bars = '';
      const w = 260, h = 34;
      while (x < w) {
        const bw = 1 + Math.floor(rand() * 4);
        if (rand() > 0.42) bars += '<rect x="' + x + '" y="0" width="' + bw + '" height="' + h + '" fill="#2B2620"/>';
        x += bw + 1;
      }
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' + bars + '</svg>';
      return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
    }

    function receiptNumber(seed) {
      let s = 0;
      for (let i = 0; i < seed.length; i++) s = (s * 17 + seed.charCodeAt(i)) % 90000;
      return String(10000 + s).slice(0, 5);
    }

    function formatUpdated(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      const opts = { weekday: 'short', month: 'short', day: 'numeric' };
      return d.toLocaleDateString('en-CA', opts);
    }

    // Wraps receipt content in the persistent paper shell used for the print-in
    // animation. Returns { slotHtml, contentId } so callers can later replace
    // just the inner content without re-triggering the entrance animation.
    function receiptSlot(id, rot, delay, stampHtml) {
      return (
        '<div class="receipt-slot" data-delay="' + delay + '">' +
          '<div class="receipt torn tail" data-rot="' + rot + '" style="transform: translateY(-26px) rotate(' + rot + 'deg)">' +
            '<div id="' + id + '"></div>' +
            (stampHtml || '') +
          '</div>' +
        '</div>'
      );
    }

    async function main() {
      let allItems, stores, generatedAt, storesCfg;
      try {
        const [dataRes, cfgRes] = await Promise.all([
          fetch('./data.json', { cache: 'no-store' }),
          fetch('./stores-config.json', { cache: 'no-store' }),
        ]);
        const data = await dataRes.json();
        storesCfg = await cfgRes.json();
        allItems = data.items;
        stores = data.stores;
        generatedAt = data.generatedAt;
      } catch (e) {
        document.getElementById('loading-msg').innerHTML = '<div class="loading">Could not load data.json or stores-config.json — make sure both sit next to index.html.</div>';
        return;
      }

      document.getElementById('loading-msg').remove();

      let selectedNames = loadTripSelection();
      // If the saved list no longer matches any current item (e.g. the
      // grocery list itself changed since the trip was saved), fall back
      // to the picker instead of rendering an empty trip.
      if (selectedNames && !selectedNames.some((n) => allItems.some((i) => i.name === n))) {
        clearTripSelection();
        selectedNames = null;
      }
      if (!selectedNames) {
        selectedNames = await waitForTripStart(allItems);
        saveTripSelection(selectedNames);
      }
      showTripBar(selectedNames.length, allItems.length);

      const items = allItems.filter((i) => selectedNames.includes(i.name));

      const updated = formatUpdated(generatedAt);
      document.getElementById('lede').textContent =
        'Ottawa, ON — ' + items.length + ' item' + (items.length === 1 ? '' : 's') + ' on this trip, prices as of ' + updated + '.';

      const superstore = computeStoreTotal(items, 'Superstore', storesCfg);
      const candidates = stores.filter((s) => s !== 'Superstore').map((s) => ({ store: s, ...computeStoreTotal(items, s, storesCfg) }));
      const complete = candidates.filter((c) => c.missing === 0).sort((a, b) => a.total - b.total);
      const cheapestSingle = complete[0];
      const savingsSingle = superstore.total - cheapestSingle.total;
      const pctSingle = Math.round((savingsSingle / superstore.total) * 100);
      const cheapestTier = tierOf(storesCfg, cheapestSingle.store);
      const cheapestTierLabel = (storesCfg.tierDefaults[cheapestTier] || {}).label || cheapestTier;
      const cheapestAddr = (storesCfg.stores[cheapestSingle.store] || {}).address || '';

      // --- static shells (built once) ---
      document.getElementById('card-superstore').outerHTML = receiptSlot('rc-superstore', -1.1, 0, null);
      document.getElementById('card-cheapest').outerHTML = receiptSlot('rc-cheapest', 0.9, 140, savingsSingle > 0
        ? '<div class="r-stamp">SAVE ' + fmt(savingsSingle) + '<br>' + pctSingle + '% OFF</div>' : null);
      document.getElementById('card-compare').outerHTML = receiptSlot('rc-compare', -0.5, 280, null);
      document.getElementById('card-mix').outerHTML = receiptSlot('rc-mix', -0.6, 420, null);

      // --- fixed content: Superstore + cheapest one-stop (not threshold-dependent) ---
      document.getElementById('rc-superstore').innerHTML = (
        '<div class="r-header"><div class="r-store">Superstore</div><div class="r-loc">' +
        ((storesCfg.stores['Superstore'] || {}).address || 'Ottawa, ON') + '</div></div>' +
        '<hr class="r-rule">' +
        '<div class="r-meta-row"><span>TXN TYPE</span><span class="v">ONE-STOP SHOP</span></div>' +
        '<div class="r-meta-row"><span>ITEMS</span><span class="v">' + items.length + '</span></div>' +
        '<hr class="r-rule">' +
        items.map((i) => itemRowHtml(i.name, i.prices['Superstore'])).join('') +
        '<hr class="r-rule heavy">' +
        '<div class="r-total"><span>TOTAL</span><span class="num">' + fmt(superstore.total) + '</span></div>' +
        '<div class="r-barcode" style="background-image:' + barcodeSvg('superstore') + '"></div>' +
        '<div class="r-footer">NO. ' + receiptNumber('superstore') + ' &nbsp;·&nbsp; ' + updated + '</div>'
      );

      document.getElementById('rc-cheapest').innerHTML = (
        '<div class="r-header"><div class="r-store">' + cheapestSingle.store + '</div><div class="r-loc">' + cheapestAddr + '</div></div>' +
        '<hr class="r-rule">' +
        '<div class="r-meta-row"><span>TXN TYPE</span><span class="v">ONE-STOP SHOP · ' + cheapestTierLabel.toUpperCase() + '</span></div>' +
        '<div class="r-meta-row"><span>ITEMS</span><span class="v">' + items.length + '</span></div>' +
        '<hr class="r-rule">' +
        items.map((i) => itemRowHtml(i.name, i.prices[cheapestSingle.store])).join('') +
        '<hr class="r-rule heavy">' +
        '<div class="r-total"><span>TOTAL</span><span class="num">' + fmt(cheapestSingle.total) + '</span></div>' +
        '<div class="r-barcode" style="background-image:' + barcodeSvg(cheapestSingle.store) + '"></div>' +
        '<div class="r-footer">NO. ' + receiptNumber(cheapestSingle.store) + ' &nbsp;·&nbsp; ' + updated + '</div>'
      );

      // --- dynamic renderer, re-run whenever the dial moves ---
      function renderDynamic() {
        const multiplier = parseFloat(document.getElementById('mult-slider').value);
        const winter = document.getElementById('winter-toggle').checked;
        document.getElementById('dial-mult').textContent = multiplier.toFixed(1) + '×' + (winter ? ' · winter' : '');

        const thresholdLines = ['cheap', 'medium', 'expensive'].map((tier) => {
          const t = effectiveThreshold(storesCfg, tier, multiplier, winter);
          const label = storesCfg.tierDefaults[tier].label;
          return label + ' needs ≥ ' + fmt(t);
        }).join(' &nbsp;·&nbsp; ');
        document.getElementById('dial-thresholds').innerHTML = thresholdLines;

        // --- item-by-item: Superstore vs the cheapest one-stop store ---
        const threshForCheapest = effectiveThreshold(storesCfg, cheapestTier, multiplier, winter);
        const compareRows = items.map((item) => {
          const altPrice = item.prices[cheapestSingle.store];
          if (altPrice == null) {
            return '<div class="r-item"><span class="name">' + item.name + '</span><span class="leader"></span><span class="price na num">n/a</span></div>';
          }
          const savings = item.prices['Superstore'] - altPrice;
          let cls, tagCls, tagText;
          if (savings >= threshForCheapest) { cls = 'justify'; tagCls = 'tag-justify'; tagText = 'worth the trip'; }
          else if (savings > 0) { cls = 'bonus'; tagCls = 'tag-bonus'; tagText = 'nice bonus'; }
          else { cls = 'none'; tagCls = 'tag-none'; tagText = 'stay home'; }
          return compareRowHtml({ name: item.name, savings, cls, tagCls, tagText });
        }).join('');

        document.getElementById('rc-compare').innerHTML = (
          '<div class="r-header"><div class="r-store">Superstore vs ' + cheapestSingle.store + '</div><div class="r-loc">Item by item</div></div>' +
          '<hr class="r-rule">' +
          '<div class="r-legend">' +
            '<span class="tag tag-justify">worth the trip</span>clears the ' + cheapestTierLabel.toLowerCase() + ' bar alone<br>' +
            '<span class="tag tag-bonus">nice bonus</span>cheaper here, but not on its own<br>' +
            '<span class="tag tag-none">stay home</span>no better than Superstore' +
          '</div>' +
          '<hr class="r-rule">' +
          compareRows +
          '<div class="r-footer" style="margin-top:14px;">NO. ' + receiptNumber('compare') + ' &nbsp;·&nbsp; ' + updated + '</div>'
        );

        // --- tier-gated mix & match ---
        const assignments = assignItems(items, stores, storesCfg, multiplier, winter);
        const mix = buildMixGroups(assignments);
        const savingsMix = superstore.total - mix.total;
        const pctMix = superstore.total > 0 ? Math.round((savingsMix / superstore.total) * 100) : 0;
        const stopByStop = buildStopByStop(mix.groups, storesCfg);

        const stayingHtml = mix.staying.length
          ? '<div class="r-group-label muted">— STAYS AT SUPERSTORE ·  ' + mix.staying.length + ' item' + (mix.staying.length > 1 ? 's' : '') + ' —</div>' +
            mix.staying.map((r) => itemRowHtml(r.name, r.assignedPrice)).join('')
          : '';

        const groupsHtml = mix.groups.map((g) => (
          '<div class="r-group-label">— AT ' + g.store.toUpperCase() + ' —</div>' +
          g.rows.map((r) => itemRowHtml(r.name, r.assignedPrice)).join('') +
          '<div class="r-subtotal"><span>SUBTOTAL</span><span class="v num">' + fmt(g.subtotal) + '</span></div>'
        )).join('');

        const stopRows = stopByStop.map((r, idx) => (
          '<div class="stop-row"><div class="stop-left"><span class="stop-store">' + (idx + 1) + '. ' + r.store + '</span>' +
          '<span class="stop-sub">' + r.tierLabel + (r.minutes ? ' · ~' + r.minutes + ' min' : '') + ' · ' + r.count + ' item' + (r.count > 1 ? 's' : '') + '</span></div>' +
          '<div class="stop-right"><span class="add">+' + fmt(r.savings) + '</span><span class="running">running ' + fmt(r.running) + '</span></div></div>'
        )).join('');

        const stopByStopBlock = stopByStop.length
          ? '<hr class="r-rule">' +
            '<div class="r-group-label">STOP-BY-STOP: IS THE NEXT ONE WORTH IT?</div>' +
            stopRows
          : '<hr class="r-rule"><div class="r-note" style="margin-top:0;">Nothing clears the bar right now — everything stays at Superstore.</div>';

        document.getElementById('rc-mix').innerHTML = (
          (savingsMix > 0 ? '<div class="r-stamp">SAVE ' + fmt(savingsMix) + '<br>' + pctMix + '% OFF</div>' : '') +
          '<div class="r-header"><div class="r-store">Mix &amp; Match</div><div class="r-loc">Only when a store clears its bar</div></div>' +
          '<hr class="r-rule">' +
          '<div class="r-meta-row"><span>TXN TYPE</span><span class="v">SPLIT ACROSS ' + mix.storeCount + '</span></div>' +
          '<div class="r-meta-row"><span>ITEMS</span><span class="v">' + items.length + '</span></div>' +
          '<div class="r-meta-row"><span>CONSOLIDATION</span><span class="v">WITHIN ' + fmt(STICKY_BUFFER) + '</span></div>' +
          '<hr class="r-rule">' +
          stayingHtml +
          groupsHtml +
          '<hr class="r-rule heavy">' +
          '<div class="r-total"><span>TOTAL</span><span class="num">' + fmt(mix.total) + '</span></div>' +
          stopByStopBlock +
          '<div class="r-barcode" style="background-image:' + barcodeSvg('mix') + '"></div>' +
          '<div class="r-footer">NO. ' + receiptNumber('mix') + ' &nbsp;·&nbsp; ' + updated + '</div>' +
          (mix.storeCount > 0
            ? '<div class="r-note">That is ' + mix.storeCount + ' stop' + (mix.storeCount > 1 ? 's' : '') + ' beyond Superstore for ' + fmt(savingsMix) + ' (' + pctMix + '%) more in savings.</div>'
            : '')
        );

      }

      document.getElementById('dial').hidden = false;
      document.getElementById('mult-slider').addEventListener('input', renderDynamic);
      document.getElementById('winter-toggle').addEventListener('change', renderDynamic);
      renderDynamic();

      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.querySelectorAll('.receipt').forEach((el) => {
        const slot = el.closest('.receipt-slot');
        const delay = parseInt(slot.getAttribute('data-delay') || '0', 10);
        const rot = el.getAttribute('data-rot') || '0';
        if (prefersReduced) {
          el.style.opacity = '1';
          el.style.transform = 'rotate(' + rot + 'deg)';
        } else {
          requestAnimationFrame(() => {
            setTimeout(() => {
              el.style.transition = 'opacity 480ms ease, transform 480ms cubic-bezier(.2,.8,.2,1)';
              el.style.opacity = '1';
              el.style.transform = 'rotate(' + rot + 'deg)';
            }, delay);
          });
        }
      });
    }

    main();
  </script>
</body>
</html>
