<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Where to buy your list — Ottawa grocery savings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1B2A20;
    --card-bg: #21311F;
    --border: #33452F;
    --dashed: #2C3B29;
    --text-hi: #F7F4EB;
    --text-body: #DDE4D6;
    --text-dim: #B7C3AF;
    --text-mute: #92A38C;
    --text-faint: #71826B;
    --text-vfaint: #566153;
    --gold: #E3B24C;
    --gold-dim: #C6BB86;
    --stamp: #C1573B;
    --focus: #E3B24C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Libre Franklin', sans-serif;
    background: var(--bg);
    background-image: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(227,178,76,0.06), transparent);
    color: var(--text-hi);
    min-height: 100vh;
    padding: 40px 16px 64px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 540px; margin: 0 auto; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .masthead { margin-bottom: 30px; }
  .meta-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-mute); margin-bottom: 10px; letter-spacing: 0.2px; }
  .meta-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1.14;
    margin: 0;
    color: var(--text-hi);
    letter-spacing: -0.2px;
  }
  .lede { color: var(--text-dim); font-size: 15px; margin-top: 10px; line-height: 1.55; max-width: 46ch; }
  .num { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  .sheet {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 4px 20px;
  }

  .card { border-top: 1px solid var(--border); padding: 18px 0; }
  .card:first-child { border-top: none; }
  .card-head {
    width: 100%; background: none; border: none; padding: 4px 0; margin: -4px 0; cursor: pointer;
    text-align: left; color: inherit; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; font: inherit; border-radius: 8px;
  }
  .card-head-left { min-width: 0; }
  .eyebrow { font-size: 11px; letter-spacing: 0.5px; color: var(--text-faint); margin-bottom: 4px; font-weight: 600; }
  .card-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 21px; color: var(--text-hi); }
  .card-sub { font-size: 13px; color: var(--text-mute); margin-top: 3px; }
  .card-head-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .total-block { text-align: right; }
  .total-amt { font-size: 20px; font-weight: 600; color: var(--text-hi); }
  .savings-tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: #2B1B14; background: var(--stamp);
    margin-top: 5px; font-weight: 600; letter-spacing: 0.2px;
    padding: 2px 7px 3px; border-radius: 4px; transform: rotate(-2deg);
  }
  .chev { transition: transform 220ms ease; flex-shrink: 0; opacity: 0.7; }
  .chev.open { transform: rotate(180deg); }

  .acc-body { overflow: hidden; display: grid; grid-template-rows: 0fr; transition: grid-template-rows 300ms ease; margin-top: 0; }
  .acc-body.open { grid-template-rows: 1fr; margin-top: 16px; }
  .acc-body > div { min-height: 0; overflow: hidden; }

  .item-row {
    display: flex; justify-content: space-between; gap: 12px; padding: 7px 0;
    border-bottom: 1px dashed var(--dashed); font-size: 14px;
  }
  .item-row:last-child { border-bottom: none; }
  .item-row .name { color: var(--text-body); }
  .item-row.dim .name { color: var(--text-dim); }
  .item-row .price { color: var(--gold); flex-shrink: 0; }
  .item-row.dim .price { color: var(--gold-dim); }
  .item-row .price.na { color: var(--text-vfaint); }

  .group-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .group-head-left { display: flex; align-items: center; gap: 6px; }
  .group-store { font-weight: 600; font-size: 15px; color: var(--text-hi); }
  .group-count { font-size: 12.5px; color: var(--text-faint); }
  .group-subtotal { font-size: 14.5px; color: var(--gold-dim); }
  .group { margin-bottom: 20px; }
  .group:last-child { margin-bottom: 4px; }

  .footnote { font-size: 12.5px; color: var(--text-faint); margin-top: 22px; line-height: 1.55; padding: 0 4px; }
  .loading { color: var(--text-mute); font-size: 14px; padding: 48px 0; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    .acc-body, .chev { transition: none !important; }
  }

  @media (max-width: 400px) {
    h1 { font-size: 27px; }
    .card-title { font-size: 19px; }
    .total-amt { font-size: 18px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="masthead">
      <div class="meta-row" id="meta-line"><span class="meta-dot"></span>Loading…</div>
      <h1>Where to buy your list</h1>
      <p class="lede">Three ways to shop the same items — one stop at Superstore, one stop at the cheapest complete store, or splitting the list across banners for the lowest possible total.</p>
    </div>
    <div class="sheet" id="cards"><div class="loading">Loading prices…</div></div>
  </div>

  <script>
    const PIN_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#E3B24C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>';
    const CHEV_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#92A38C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>';

    const fmt = (n) => '$' + n.toFixed(2);

    function computeStoreTotal(items, stores, store) {
      let total = 0, missing = 0;
      for (const item of items) {
        const p = item.prices[store];
        if (p == null) missing += 1; else total += p;
      }
      return { total, missing };
    }

    function computeMixAndMatch(items, stores) {
      const perItem = items.map((item) => {
        let bestStore = null, bestPrice = Infinity;
        for (const store of stores) {
          const p = item.prices[store];
          if (p != null && p < bestPrice) { bestPrice = p; bestStore = store; }
        }
        return { name: item.name, store: bestStore, price: bestPrice };
      });
      const byStore = {};
      for (const row of perItem) {
        if (!byStore[row.store]) byStore[row.store] = [];
        byStore[row.store].push(row);
      }
      const groups = Object.entries(byStore).map(([store, rows]) => ({
        store,
        rows: rows.sort((a, b) => b.price - a.price),
        subtotal: rows.reduce((s, r) => s + r.price, 0),
      })).sort((a, b) => b.subtotal - a.subtotal);
      const total = perItem.reduce((s, r) => s + r.price, 0);
      return { groups, total, storeCount: groups.length };
    }

    function itemRowHtml(name, price, dim) {
      const priceHtml = price == null
        ? '<span class="price na num">not carried</span>'
        : '<span class="price num">' + fmt(price) + '</span>';
      return '<div class="item-row' + (dim ? ' dim' : '') + '"><span class="name">' + name + '</span>' + priceHtml + '</div>';
    }

    function cardHtml(id, eyebrow, title, subtitle, total, savings, savingsPct, bodyHtml, expanded) {
      const savingsHtml = (savings != null && savings > 0)
        ? '<div class="savings-tag">save ' + fmt(savings) + ' · ' + savingsPct + '%</div>'
        : '';
      return (
        '<div class="card" data-id="' + id + '">' +
          '<button class="card-head" data-toggle="' + id + '" aria-expanded="' + (expanded ? 'true' : 'false') + '">' +
            '<div class="card-head-left">' +
              '<div class="eyebrow">' + eyebrow + '</div>' +
              '<div class="card-title">' + title + '</div>' +
              '<div class="card-sub">' + subtitle + '</div>' +
            '</div>' +
            '<div class="card-head-right">' +
              '<div class="total-block">' +
                '<div class="total-amt num">' + fmt(total) + '</div>' +
                savingsHtml +
              '</div>' +
              '<span class="chev' + (expanded ? ' open' : '') + '" data-chev="' + id + '">' + CHEV_SVG + '</span>' +
            '</div>' +
          '</button>' +
          '<div class="acc-body' + (expanded ? ' open' : '') + '" data-body="' + id + '"><div>' + bodyHtml + '</div></div>' +
        '</div>'
      );
    }

    function formatUpdated(iso) {
      if (!iso) return 'Prices from GroceryPulse';
      const d = new Date(iso);
      const opts = { weekday: 'short', month: 'short', day: 'numeric' };
      return 'Updated ' + d.toLocaleDateString('en-CA', opts);
    }

    async function main() {
      let items, stores, generatedAt;
      try {
        const res = await fetch('./data.json', { cache: 'no-store' });
        const data = await res.json();
        items = data.items;
        stores = data.stores;
        generatedAt = data.generatedAt;
      } catch (e) {
        document.getElementById('cards').innerHTML = '<div class="loading">Could not load data.json — make sure it sits next to index.html.</div>';
        return;
      }

      document.getElementById('meta-line').innerHTML =
        '<span class="meta-dot"></span>Ottawa · ' + items.length + ' items · ' + formatUpdated(generatedAt);

      const superstore = computeStoreTotal(items, stores, 'Superstore');
      const candidates = stores.filter((s) => s !== 'Superstore').map((s) => ({ store: s, ...computeStoreTotal(items, stores, s) }));
      const complete = candidates.filter((c) => c.missing === 0).sort((a, b) => a.total - b.total);
      const cheapestSingle = complete[0];
      const mix = computeMixAndMatch(items, stores);

      const savingsSingle = superstore.total - cheapestSingle.total;
      const savingsMix = superstore.total - mix.total;
      const pctSingle = Math.round((savingsSingle / superstore.total) * 100);
      const pctMix = Math.round((savingsMix / superstore.total) * 100);

      const superstoreBody = items.map((i) => itemRowHtml(i.name, i.prices['Superstore'])).join('');
      const cheapestBody = items.map((i) => itemRowHtml(i.name, i.prices[cheapestSingle.store])).join('');

      const mixBody = mix.groups.map((g) => {
        const rowsHtml = g.rows.map((r) => itemRowHtml(r.name, r.price, true)).join('');
        return (
          '<div class="group">' +
            '<div class="group-head">' +
              '<div class="group-head-left">' + PIN_SVG +
                '<span class="group-store">' + g.store + '</span>' +
                '<span class="group-count">· ' + g.rows.length + ' item' + (g.rows.length > 1 ? 's' : '') + '</span>' +
              '</div>' +
              '<span class="group-subtotal num">' + fmt(g.subtotal) + '</span>' +
            '</div>' +
            rowsHtml +
          '</div>'
        );
      }).join('');

      const html =
        cardHtml('superstore', 'ONE STOP', 'Superstore', 'All ' + items.length + ' items', superstore.total, null, null, superstoreBody, false) +
        cardHtml('cheapest', 'ONE STOP · CHEAPEST', cheapestSingle.store, 'All ' + items.length + ' items, lowest single-store total', cheapestSingle.total, savingsSingle, pctSingle, cheapestBody, false) +
        cardHtml('mix', 'MIX & MATCH · ' + mix.storeCount + ' STOPS', 'Cheapest per item', 'Split across ' + mix.storeCount + ' stores', mix.total, savingsMix, pctMix, mixBody, true);

      document.getElementById('cards').innerHTML = html;

      document.getElementById('cards').insertAdjacentHTML('afterend',
        '<p class="footnote">Mix &amp; match means ' + mix.storeCount + ' separate stops. Weigh the ' + fmt(savingsMix) + ' saved against the extra driving before committing to the full split.</p>');

      document.querySelectorAll('[data-toggle]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-toggle');
          const body = document.querySelector('[data-body="' + id + '"]');
          const isOpen = body.classList.contains('open');
          toggle(id, !isOpen);
        });
      });
    }

    function toggle(id, open) {
      const body = document.querySelector('[data-body="' + id + '"]');
      const chev = document.querySelector('[data-chev="' + id + '"]');
      const btn = document.querySelector('[data-toggle="' + id + '"]');
      if (!body) return;
      body.classList.toggle('open', open);
      if (chev) chev.classList.toggle('open', open);
      if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    main();
  </script>
</body>
</html>
